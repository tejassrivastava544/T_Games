<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body {
            background-color: #34495e;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #2980b9;
        }

        /* Centering the game board */
        canvas {
            background-color: #000000;
            border: 5px solid #ecf0f1;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ Back to Menu</a>
    
    <!-- Changed ID to "canvas" so your JS can find and resize it automatically -->
    <canvas id="canvas"></canvas>

    <!-- You must load all three files for the starter project to work -->
    <script src="render.js"></script>
    <script src="input.js"></script>
    <script src="game.js"></script>

</body>
</html>
