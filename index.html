<!DOCTYPE html>
<html>
<head>
    <title>My Arcade Hub</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        /* The container that holds all game cards */
        .arcade-gallery {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap; /* Allows cards to wrap to the next line on small screens */
        }

        /* The individual game card */
        .game-card {
            background-color: #34495e;
            padding: 20px;
            border-radius: 15px;
            width: 250px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            transition: transform 0.3s;
        }

        /* Makes the card pop up slightly when you hover over it */
        .game-card:hover {
            transform: translateY(-10px);
        }

        /* Styling for the game thumbnail image */
        .game-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background-color: #1a252f; /* Dark background behind image */
        }

        .game-card h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        /* The Play button inside the card */
        .game-btn {
            display: block;
            background-color: #e74c3c;
            color: white;
            padding: 12px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .game-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>🕹️ My Arcade 🕹️</h1>
    
    <div class="arcade-gallery">
        
        <!-- GAME CARD 1: SNAKE -->
        <div class="game-card">
            <!-- REPLACE 'snake-img.png' WITH YOUR ACTUAL IMAGE FILE NAME -->
            <img src="snake-img.jpg" alt="Snake Thumbnail" class="game-img">
            <h2>Snake</h2>
            <a href="snake.html" class="game-btn">Play Now</a>
        </div>

        <!-- Future Game Cards will go here -->
                <!-- GAME CARD 2: FLAPPY BIRD -->
        <div class="game-card">
            <!-- Upload an image and name it flappy-img.png -->
            <img src="flappy-img.jpg" alt="Flappy Bird" class="game-img">
            <h2>Flappy Bird</h2>
            <a href="flappy/flappy.html" class="game-btn">Play Now</a>
        </div>
        
                <!-- GAME CARD 3: MARIO RUNNER -->
        <div class="game-card">
            <img src="mario-img.jpg" alt="Mario Runner" class="game-img">
            <h2>Mario Runner</h2>
            <a href="mario/mario.html" class="game-btn">Play Now</a>
        </div>
        
                <!-- GAME CARD 4: CHROME DINO -->
        <div class="game-card">
            <img src="dino-img.jpg" alt="Chrome Dino" class="game-img">

                <!-- GAME CARD 5: SPACE INVADERS -->
        <div class="game-card">
            <img src="invaders-img.jpg" alt="Space Invaders" class="game-img">

    </div>
